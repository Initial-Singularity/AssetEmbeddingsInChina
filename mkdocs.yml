site_name: AssetEmbeddingsInChina
site_description: Asset Embeddings for China's A-share market — NLP methods for asset pricing
site_url: https://initial-singularity.github.io/AssetEmbeddingsInChina/
repo_url: https://github.com/Initial-Singularity/AssetEmbeddingsInChina
repo_name: Initial-Singularity/AssetEmbeddingsInChina
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - autorefs:
      resolve_closest: true
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: true
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 3
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: [".", "docs"]
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/quickstart.md
  - How-to guides:
      - how-to/install.md
      - how-to/prepare-data.md
      - how-to/train.md
      - how-to/text-embeddings.md
      - how-to/generate-configs.md
  - Explanation:
      - explanation/method.md
      - explanation/config-system.md
      - explanation/records-system.md
      - explanation/preparers.md
      - explanation/logging-system.md
      - explanation/data-pipeline.md
  - Reference:
      - reference/cli.md
      - API:
          - reference/api/index.md
          - reference/api/configs.md
          - reference/api/datasets.md
          - reference/api/preparers.md
          - reference/api/models.md
          - reference/api/records.md
          - reference/api/utils.md
  - Contributing: contributing.md
