repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # allow mkdocs.yml custom !!python/name: tags (Mermaid fence)
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^(examples/data/.*\.csv|uv\.lock)$
