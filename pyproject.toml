[project]
name = "AssetEmbeddingsInChina"
version = "1.0.0"
description = "NLP-based asset embeddings for China's A-share market — code for 'Do Asset Embeddings Need Complete Holdings? Lessons from China'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.7.0",
    "bitsandbytes>=0.45.5",
    "colorama>=0.4.6",
    "dadaptation>=3.2",
    "dotenv>=0.9.9",
    "gensim>=4.3.3",
    "ipython>=9.2.0",
    "lion-pytorch>=0.2.3",
    "matplotlib>=3.10.3",
    "numpy>=1.22,<2.1",
    "pandas>=2.2.3",
    "psutil>=7.0.0",
    "safetensors>=0.5.3",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
    "statsmodels>=0.14.4",
    "tensorboard>=2.19.0",
    "toml>=0.10.2",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
    "transformers>=4.51.3",
]

[project.optional-dependencies]
# Demo-only extras. Not required for the core training/eval pipeline.
# Install with: `uv sync --extra notebook`
notebook = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
# Documentation site (mkdocs-material + mkdocstrings). Not required for the pipeline.
# Build/serve with `uv run mkdocs serve` after `uv sync --extra docs`.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-static-i18n>=1.2",
    "mkdocs-redirects>=1.2",
    "mkdocs-jupyter>=0.25",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asset_embeddings"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "_dev",
    "_writing",
    "paper",
    "build",
    ".venv",
    "colab_temp",
    "demo_configs",
    "demo_models",
]

[tool.ruff.lint]
# Baseline: the four ignores keep pre-existing layout debt out of every PR's diff.
#   E501 line too long (layout only)
#   F401 unused import (auto-fix cleared the tree; kept so a stray import is not a PR failure)
#   E402 import not at top of file (examples adjust sys.path before importing)
#   F841 unused variable (a dozen assignments kept for their side effects, e.g. `store = RecordStore(...)`)
# Docstrings: Google convention (matches mkdocs.yml `docstring_style: google`).
#   D105 magic methods and D107 __init__ need no docstring (the class docstring covers __init__;
#   mkdocstrings merges them).
select = ["E4", "E7", "E9", "F", "D"]
ignore = ["E501", "F401", "E402", "F841", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Examples are the notebooks' companions.
"examples/**" = ["D1"]
